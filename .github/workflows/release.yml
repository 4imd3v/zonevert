name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux
                      command: pnpm run package:linux
                    - os: windows-latest
                      target: windows
                      command: pnpm run package:windows
                    - os: macos-latest
                      target: macos
                      command: pnpm run package:macos

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Install macOS dependencies
              if: matrix.os == 'macos-latest'
              run: |
                  rustup target add aarch64-apple-darwin x86_64-apple-darwin

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Import macOS signing certificate
              if: matrix.target == 'macos' && env.APPLE_CERTIFICATE != ''
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              run: |
                  CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
                  KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
                  echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
                  security create-keychain -p "" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "" "$KEYCHAIN_PATH"
                  security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
                  security list-keychain -d user -s "$KEYCHAIN_PATH"

            - name: Check
              run: pnpm run check

            - name: Typecheck
              run: pnpm run typecheck

            - name: Rust tests
              run: cargo test --manifest-path src-tauri/Cargo.toml

            # Signing envs must be *unset* for unsigned fallback: an empty
            # APPLE_SIGNING_IDENTITY makes tauri try codesign with "" and
            # fail with "no identity found". GITHUB_ENV only exports when
            # these steps run.
            - name: Configure macOS signing identity
              if: matrix.target == 'macos' && vars.APPLE_SIGNING_IDENTITY != ''
              run: echo "APPLE_SIGNING_IDENTITY=${{ vars.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"

            - name: Configure Windows signing certificate
              if: matrix.target == 'windows' && secrets.WINDOWS_CERTIFICATE != ''
              run: |
                  echo "WINDOWS_CERTIFICATE=${{ secrets.WINDOWS_CERTIFICATE }}" >> "$GITHUB_ENV"
                  echo "WINDOWS_CERTIFICATE_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"

            - name: Package
              run: ${{ matrix.command }}

            - name: Notarize and staple macOS app
              if: matrix.target == 'macos' && env.APPLE_ID != ''
              env:
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)"
                  xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
                  xcrun stapler staple "$DMG"

            - uses: actions/upload-artifact@v4
              with:
                  name: zonevert-${{ matrix.target }}
                  path: |
                      src-tauri/target/release/bundle/deb/*.deb
                      src-tauri/target/release/bundle/appimage/*.AppImage
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/msi/*.msi
                      src-tauri/target/release/bundle/dmg/*.dmg

    release:
        needs: build
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')

        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Flatten artifacts
              run: |
                  mkdir -p release-assets
                  find artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) -exec cp {} release-assets/ \;
                  ls -la release-assets/

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: release-assets/*
